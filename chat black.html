  <style>

    :root {

      --text: #171717;

      --line: #e9e9e9;
      --wa: #25D366;

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;

      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 16px;
    }

    .page {
      width: min(100%, 470px);
      text-align: center;
    }

    .card {
      position: relative;
      background: var(--card);
      color: var(--text);
      border-radius: 24px;
      padding: 74px 30px 30px;
      box-shadow: 0 22px 70px rgba(0,0,0,.42);
    }

    .brand {
      position: absolute;
      top: -44px;
      left: 50%;
      transform: translateX(-50%);
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: #050505;
      border: 6px solid white;
      box-shadow: 0 8px 25px rgba(0,0,0,.3);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .brand-inner {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: 1px solid #555;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      color: white;
      letter-spacing: 1px;
    }

    .brand-title {
      font-size: 15px;
      font-weight: 900;
    }

    .brand-sub {
      font-size: 5px;
      letter-spacing: 1.5px;
      margin-top: 3px;
      opacity: .75;
    }

    h1 {
      font-size: clamp(25px, 7vw, 35px);
      letter-spacing: .3px;
      margin-bottom: 7px;
    }

    .subtitle {
      color: #666;
      font-size: 16px;
      margin-bottom: 25px;
    }

    .qr-wrap {
      width: min(100%, 310px);
      aspect-ratio: 1;
      margin: 0 auto 24px;
      background: #fff;
      padding: 13px;
      border: 1px solid #eee;
      border-radius: 8px;
      box-shadow: 0 5px 18px rgba(0,0,0,.08);
    }

    .qr {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
    }

    .scan {
      color: #777;
      font-size: 14px;
      line-height: 1.55;
      margin-bottom: 22px;
    }

    .actions {
      display: grid;
      gap: 11px;
    }

    .button {
      width: 100%;
      border: 0;
      border-radius: 13px;
      min-height: 50px;
      padding: 13px 16px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
    }

    .button:hover {
      transform: translateY(-2px);
    }

    .whatsapp {
      color: #fff;
      background: var(--wa);
      box-shadow: 0 8px 22px rgba(37,211,102,.25);
    }

    .whatsapp:hover {
      background: var(--wa-dark);
    }

    .secondary {
      color: #222;
      background: #f3f3f3;
    }

    .number {
      margin-top: 18px;
      font-size: 14px;
      color: #666;
    }

    .number strong {
      color: #222;
    }

    .footer {
      margin-top: 25px;
      color: #8d8d8d;
      font-size: 12px;
      line-height: 1.6;
    }

    .footer strong {
      color: #bdbdbd;
    }

    .status {
      min-height: 18px;
      margin-top: 8px;
      color: #159447;
      font-size: 12px;
      font-weight: 700;
    }

    @media (max-width: 430px) {
      body {
        padding: 24px 12px;
      }

      .card {
        border-radius: 20px;
        padding: 68px 19px 24px;
      }

      .qr-wrap {
        width: min(100%, 285px);
      }
    }
  </style>
</head>
