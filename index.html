<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="refresh" content="0; url=./blackorganization.html" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Black Organization</title>
    <style>
      :root {
        --black: #0a0904;
        --gold: #c9a227;
        --gold-light: #e8cc7c;
        --ivory: #f3ede0;
      }
      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--black);
        color: var(--ivory);
        font-family: Arial, Helvetica, sans-serif;
      }
      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
      }
      .redirect-box {
        text-align: center;
        padding: 32px 40px;
        border: 1px solid rgba(232, 204, 124, 0.5);
        background: rgba(20, 18, 16, 0.9);
        box-shadow: 0 0 30px rgba(201, 162, 39, 0.15);
      }
      .brand {
        color: var(--gold-light);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        font-size: 12px;
        margin-bottom: 12px;
      }
      h1 {
        margin: 0 0 10px;
        font-size: clamp(1.8rem, 3vw, 3rem);
      }
      a {
        color: var(--gold-light);
        text-decoration: none;
        font-weight: 600;
      }
      a:hover {
        text-decoration: underline;
      }
      p {
        margin: 0;
        color: #d8d1c3;
      }
    </style>
  </head>
  <body>
    <div class="redirect-box">
      <div class="brand">Black Organization</div>
      <h1>Loading homepage...</h1>
      <p>
        If you are not redirected automatically,
        <a href="./blackorganization.html">click here to open the main website</a>.
      </p>
    </div>
    <script>
      window.location.replace('./blackorganization.html');
    </script>
  </body>
</html>
